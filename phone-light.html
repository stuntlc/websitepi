<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phone Light | Skunk Works</title>
<style>
body { margin: 0; background: #000; color: #fff; font: 600 16px/1.5 "Courier New", monospace; }
main { max-width: 720px; margin: auto; padding: 24px; }
h1 { color: #00ff66; }
button, a, input { font: inherit; padding: 10px; border: 1px solid #00a83f; color: #fff; background: #0b2517; }
button, a { cursor: pointer; }
input { width: 100%; box-sizing: border-box; margin: 8px 0; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0; }
.warning { color: #ffe066; }
.error { color: #ff7b83; }
</style>
<link rel="stylesheet" href="responsive.css">
</head>
<body>
<main>
  <h1>PHONE LIGHT</h1>
  <a href="index.html">[ CONTROL ]</a>
  <p class="warning">Flashing light can trigger seizures. Keep it away from people who may be photosensitive.</p>
  <p>Strobe flashes at up to 2 times per second until stopped. Stop the signal before using the regular flashlight controls or phone camera.</p>
  <label for="message">Morse message (English letters, digits and spaces; maximum 100 characters)</label>
  <input id="message" maxlength="100" autocomplete="off">
  <div class="controls">
    <button id="morse" type="button">[ SEND MORSE ]</button>
    <button id="strobe" type="button">[ START STROBE ]</button>
    <button id="stop" type="button">[ STOP ]</button>
  </div>
  <p id="status" role="status" aria-live="polite">Checking flashlight service...</p>
</main>
<script>
const status = document.getElementById("status");
let busy = false;

async function request(action, mode = "", message = "") {
  const options = { cache: "no-store" };
  if (action !== "status") {
    options.method = "POST";
    options.headers = { "Content-Type": "application/x-www-form-urlencoded" };
    options.body = new URLSearchParams(action === "start" ? { action, mode, message } : { action });
  }
  const response = await fetch("/cgi-bin/phone-light.cgi", options);
  const data = await response.json();
  if (!response.ok || !data.ok) throw new Error(data.error || "Flashlight request failed.");
  return data;
}

function show(data) {
  status.classList.toggle("error", Boolean(data.error));
  status.textContent = data.error || (data.mode ? data.mode.toUpperCase() + " RUNNING" : "READY");
}

async function action(name, mode = "") {
  if (busy) return;
  busy = true;
  try {
    const message = mode === "morse" ? document.getElementById("message").value : "";
    show(await request(name, mode, message));
  } catch (error) {
    status.classList.add("error");
    status.textContent = error.message;
  } finally {
    busy = false;
  }
}

document.getElementById("morse").addEventListener("click", () => action("start", "morse"));
document.getElementById("strobe").addEventListener("click", () => action("start", "strobe"));
document.getElementById("stop").addEventListener("click", () => action("stop"));

async function refresh() {
  if (busy) return;
  try { show(await request("status")); }
  catch (error) { status.classList.add("error"); status.textContent = error.message; }
}
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
