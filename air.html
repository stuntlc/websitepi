<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIR | Skunk Works</title>
<style>
:root { --ink: #fff; --green: #00ff66; --line: #00a83f; }
* { box-sizing: border-box; }
body { margin: 0; color: var(--ink); background: #000; font-family: "Courier New", monospace; font-size: 14px; font-weight: 600; }
main { max-width: 1180px; margin: 0 auto; padding: 28px 20px 44px; }
header { display: flex; flex-wrap: wrap; gap: 18px; justify-content: space-between; align-items: end; border-bottom: 1px solid var(--line); padding-bottom: 18px; margin-bottom: 14px; }
header nav { display: flex; flex-wrap: wrap; gap: 8px; }
h1 { margin: 0; color: var(--green); letter-spacing: 3px; }
a, button { border: 1px solid var(--line); background: #0b2517; color: var(--ink); padding: 9px 13px; font: inherit; text-decoration: none; cursor: pointer; }
#wrap { position: relative; }
#map { height: 78vh; min-height: 420px; border: 1px solid var(--line); background: #111; }
.modes { display: flex; gap: 6px; margin: 10px; }
.modes button { background: rgba(0,0,0,.85); }
.modes button.active { background: var(--green); color: #000; }
#note { position: absolute; left: 10px; bottom: 28px; z-index: 5; background: rgba(0,0,0,.8); padding: 4px 8px; font-size: 12px; }
.iw { color: #000; font-family: "Courier New", monospace; }
</style>
<link rel="stylesheet" href="responsive.css">
</head>
<body>
<main>
  <header>
    <div><h1>AIR QUALITY</h1></div>
    <nav aria-label="Air quality links">
      <a href="https://science.nasa.gov/earth/earth-observatory/" target="_blank" rel="noopener">[ NASA EO ]</a>
      <a href="https://squall.cloud/" target="_blank" rel="noopener">[ SQUALL ]</a>
      <a href="https://www.ventusky.com/" target="_blank" rel="noopener">[ VENTUSKY ]</a>
      <a href="index.html">[ CONTROL ]</a>
    </nav>
  </header>
  <div id="wrap">
    <div id="map"></div>
    <div id="note">LOADING...</div>
  </div>
</main>
<script>
const EEA =  "https://dis2datalake.blob.core.windows.net/airquality-derivated/AQI-noRunningMeans/";
const WAQI = "https://mapq.waqi.info/mapq/bounds/?inc=placeholders&k=_2Y2EvQV0mTw8_ZCQ_ZQ4VYA&bounds=";
const note = document.getElementById("note");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const aqiColor = v => { v = Number(v); return isNaN(v) ? "#888" : v <= 50 ? "#00e400" : v <= 100 ? "#ffff00" : v <= 150 ? "#ff7e00" : v <= 200 ? "#ff0000" : v <= 300 ? "#8f3f97" : "#7e0023"; };
const dot = (color, r) => ({ path: google.maps.SymbolPath.CIRCLE, scale: r, fillColor: color, fillOpacity: .95, strokeColor: "#000", strokeWeight: 1 });

const MAX_MARKERS = 500;
const VIEW_DELAY = 250;
let map, info, euLayer, worldLayer, heat, mode = null, heatOn = false;
let euRows = null, euLoading = null, worldController = null, worldReq = 0, viewTimer;

const EU_BANDS = [null, ["Good", "#50f0e6"], ["Fair", "#50ccaa"], ["Moderate", "#f0e641"], ["Poor", "#ff5050"], ["Very poor", "#960032"], ["Extremely poor", "#7d2181"]];
const euBand = v => { const n = Math.min(6, Math.max(1, Math.round(Number(v)))); return isNaN(n) ? null : EU_BANDS[n]; };
let euLevels = {}, euLevelTime = "";

function initMap() {
  map = new google.maps.Map(document.getElementById("map"), {
    center: { lat: 50, lng: 10 }, zoom: 4, mapTypeId: "hybrid", mapTypeControl: true,
    streetViewControl: false, fullscreenControl: true, gestureHandling: "greedy"
  });
  info = new google.maps.InfoWindow();
  euLayer = new google.maps.Data();
  worldLayer = new google.maps.Data();
  euLayer.setStyle(f => {
    const b = euBand(f.getProperty("level"));
    return { icon: dot(b ? b[1] : "#888", 5) };
  });
  worldLayer.setStyle(f => ({ icon: dot(aqiColor(f.getProperty("aqi")), 6) }));
  euLayer.addListener("click", e => {
    const p = n => esc(e.feature.getProperty(n));
    const b = euBand(e.feature.getProperty("level"));
    info.setContent('<div class="iw"><b>' + p("name") + "</b><br>" + p("municipality") + "<br>" + p("station_type") + " / " + p("area_classification") +
      "<br>Air quality: <b>" + (b ? b[0] : "no data") + "</b>" + (euLevelTime ? " (" + esc(euLevelTime) + " UTC)" : "") + "<br>" + p("code") + "</div>");
    info.setPosition(e.latLng); info.open(map);
  });
  worldLayer.addListener("click", e => {
    const p = n => esc(e.feature.getProperty(n));
    info.setContent('<div class="iw"><b>' + p("city") + "</b><br>AQI: " + p("aqi") + " (" + p("pol") + ")<br>" + p("utime") + "</div>");
    info.setPosition(e.latLng); info.open(map);
  });

  // Google Air Quality API heatmap (needs the Air Quality API enabled on the key)
  heat = {
    getTile: (c, z, doc) => {
      const img = doc.createElement("img");
      img.style.opacity = .55;
      img.src = "/cgi-bin/airtile.cgi?z=" + z + "&x=" + c.x + "&y=" + c.y;
      return img;
    },
    tileSize: new google.maps.Size(256, 256), releaseTile: () => {}
  };

  const box = document.createElement("div");
  box.className = "modes";
  box.innerHTML = '<button type="button" data-m="eu">EU</button><button type="button" data-m="world">GLOBAL</button><button type="button" data-m="heat">HEAT</button>';
  box.onclick = ev => {
    const m = ev.target.dataset && ev.target.dataset.m;
    if (m === "heat") toggleHeat(); else if (m) setMode(m);
  };
  map.controls[google.maps.ControlPosition.TOP_LEFT].push(box);
  map.addListener("bounds_changed", () => {
    clearTimeout(viewTimer);
    if (worldController) worldController.abort();
    worldReq++;
  });
  map.addListener("idle", scheduleView);
  setMode("eu");
}

function toggleHeat() {
  heatOn = !heatOn;
  map.overlayMapTypes.clear();
  if (heatOn) map.overlayMapTypes.push(heat);
  document.querySelector('[data-m="heat"]').classList.toggle("active", heatOn);
}

async function fetchJSON(url, options) {
  const response = await fetch(url, options);
  if (!response.ok) throw new Error("HTTP " + response.status + " loading " + url);
  return response.json();
}

function validStation(row) {
  return row && row.lat != null && row.lon != null &&
    Number.isFinite(Number(row.lat)) && Number.isFinite(Number(row.lon)) &&
    Math.abs(Number(row.lat)) <= 90 && Math.abs(Number(row.lon)) <= 180;
}

function viewBounds() {
  const b = map.getBounds();
  if (!b) return null;
  const ne = b.getNorthEast(), sw = b.getSouthWest();
  return {
    south: Math.max(-90, sw.lat()), north: Math.min(90, ne.lat()),
    west: b.toSpan().lng() >= 359 ? -180 : sw.lng(),
    east: b.toSpan().lng() >= 359 ? 180 : ne.lng()
  };
}

function stationsInView(rows, bounds) {
  const width = (bounds.east - bounds.west + 360) % 360 || 360;
  const height = bounds.north - bounds.south || 1;
  const cells = new Map();
  let count = 0;
  for (const row of rows) {
    if (!validStation(row)) continue;
    const lat = Number(row.lat), lon = Number(row.lon);
    const x = (lon - bounds.west + 360) % 360;
    if (lat < bounds.south || lat > bounds.north || x > width) continue;
    count++;
    const key = Math.min(19, Math.floor(x / width * 20)) + "," +
      Math.min(19, Math.floor((lat - bounds.south) / height * 20));
    if (!cells.has(key)) cells.set(key, []);
    cells.get(key).push(row);
  }
  const selected = [];
  for (let i = 0; selected.length < MAX_MARKERS; i++) {
    let added = false;
    for (const cell of cells.values()) {
      if (i < cell.length) {
        selected.push(cell[i]);
        added = true;
        if (selected.length === MAX_MARKERS) break;
      }
    }
    if (!added) break;
  }
  return { selected, count };
}

function renderStations(layer, rows, bounds, label) {
  const result = stationsInView(rows, bounds);
  layer.forEach(f => layer.remove(f));
  layer.addGeoJson({
    type: "FeatureCollection",
    features: result.selected.map(r => ({
      type: "Feature", properties: r,
      geometry: { type: "Point", coordinates: [Number(r.lon), Number(r.lat)] }
    }))
  });
  note.textContent = label + ": " + result.selected.length + " / " + result.count +
    " STATIONS IN VIEW" + (result.count > result.selected.length ? " - ZOOM IN FOR MORE" : "");
  if (label === "EU" && !euLevelTime) note.textContent += " - AIR QUALITY DATA UNAVAILABLE";
}

function scheduleView() {
  clearTimeout(viewTimer);
  viewTimer = setTimeout(() => {
    const bounds = viewBounds();
    if (!bounds) return;
    if (mode === "eu" && euRows) renderStations(euLayer, euRows, bounds, "EU");
    else if (mode === "world") loadWorld(bounds);
  }, VIEW_DELAY);
}

async function loadEU() {
  const idx = await fetchJSON(EEA + "content/index.json");
  const f = idx.contents.filter(n => n.startsWith("raw_stations.json")).sort().pop();
  if (!f) throw new Error("EU station list not found");
  const rows = await fetchJSON(EEA + "content/" + f);
  for (let h = 1; h <= 6 && !euLevelTime; h++) {
    const t = new Date(Date.now() - h * 3600e3).toISOString().substring(0, 13);
    try {
      const r = await fetch(EEA + "map/" + t + ".json");
      if (r.ok) { euLevels = await r.json(); euLevelTime = t.replace("T", " ") + ":00"; }
      else if (r.status !== 404) console.warn("EU air quality data: HTTP " + r.status);
    } catch (err) { console.warn("EU air quality data:", err); }
  }
  euRows = rows.map(r => Object.assign({}, r, { level: euLevels[r.code] }));
}

async function loadWorld(bounds) {
  if (worldController) worldController.abort();
  const controller = new AbortController();
  worldController = controller;
  const id = ++worldReq;
  note.textContent = "LOADING STATIONS...";
  try {
    const ranges = bounds.west > bounds.east ? [[bounds.west, 180], [-180, bounds.east]] : [[bounds.west, bounds.east]];
    const responses = await Promise.all(ranges.map(range => fetchJSON(
      WAQI + "((" + bounds.south + "," + range[0] + "),(" + bounds.north + "," + range[1] + "))",
      { signal: controller.signal }
    )));
    if (id !== worldReq || mode !== "world") return;
    if (responses.some(rows => !Array.isArray(rows))) throw new Error("Invalid global station data");
    renderStations(worldLayer, responses.flat(), bounds, "GLOBAL");
  } catch (err) {
    if (id === worldReq && mode === "world" && err.name !== "AbortError") note.textContent = "ERROR: " + err.message;
  } finally {
    if (worldController === controller) worldController = null;
  }
}

async function setMode(m) {
  clearTimeout(viewTimer);
  if (worldController) worldController.abort();
  worldReq++;
  mode = m;
  info.close();
  document.querySelectorAll('.modes [data-m="eu"], .modes [data-m="world"]').forEach(b => b.classList.toggle("active", b.dataset.m === m));
  if (m === "eu") {
    worldLayer.setMap(null); euLayer.setMap(map);
    map.setCenter({ lat: 50, lng: 10 }); map.setZoom(4);
    if (!euRows) {
      note.textContent = "LOADING EU STATIONS...";
      try {
        if (!euLoading) euLoading = loadEU().finally(() => { euLoading = null; });
        await euLoading;
      } catch (err) {
        if (mode === "eu") note.textContent = "ERROR: " + err.message;
        return;
      }
    }
    if (mode === "eu") scheduleView();
  } else {
    euLayer.setMap(null); worldLayer.setMap(map);
    map.setCenter({ lat: 20, lng: 0 }); map.setZoom(2);
    scheduleView();
  }
}

window.gm_authFailure = () => { note.textContent = "GOOGLE MAPS KEY REJECTED"; };
window.initMap = initMap;
fetch("/cgi-bin/airkey.cgi", { cache: "no-store" }).then(r => r.json()).then(d => {
  if (!d.ok) throw new Error(d.error);
  const s = document.createElement("script");
  s.async = true;
  s.src = "https://maps.googleapis.com/maps/api/js?key=" + encodeURIComponent(d.key) + "&callback=initMap&loading=async";
  document.head.appendChild(s);
}).catch(err => { note.textContent = "KEY ERROR: " + err.message; });
</script>
</body>
</html>
