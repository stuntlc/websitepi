<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skunk Works NOC</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  height: 100%;
}

body {
  background: url("skunk-bg.jpg") no-repeat center center fixed;
  background-size: cover;
  color: #eee;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.5);
  z-index: 1;
}

/* --- TOP BAR --- */
.topbar {
  position: relative;
  z-index: 1000;
  background: rgba(0, 0, 0, 0.8);
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.9);
  padding: 8px 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.topbar h1 {
  font-family: "Courier New", monospace;
  font-size: clamp(16px, 4vw, 24px);
  letter-spacing: 2px;
  text-shadow: 0 0 10px rgba(0, 255, 0, 0.8);
  text-align: center;
  color: #00ff00;
  margin: 0;
}

.controls-row {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  justify-content: center;
  align-items: center;
}

/* --- BUTTONS --- */
button, a {
  padding: 5px 8px;
  font-size: 11px;
  border-radius: 4px;
  border: 1px solid rgba(0, 255, 0, 0.4);
  cursor: pointer;
  background: rgba(0, 0, 0, 0.6);
  color: #ddd;
  text-decoration: none;
  transition: all 0.2s ease;
  white-space: nowrap;
  font-weight: 500;
  box-shadow: 0 0 8px rgba(0, 0, 0, 0.6);
}

button:hover, a:hover {
  background: rgba(0, 255, 0, 0.15);
  border-color: #00ff00;
  color: #00ff00;
  text-shadow: 0 0 10px rgba(0, 255, 0, 0.6);
  transform: translateY(-1px);
}

button:active, a:active {
  transform: translateY(0);
}

/* --- MAIN CONTENT --- */
.main {
  position: relative;
  z-index: 2;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 12px 12px;
  overflow-y: auto;
  overflow-x: hidden;
}

#output {
  text-align: center;
  font-size: clamp(11px, 1.5vw, 14px);
  text-shadow: 0 0 5px rgba(0, 255, 0, 0.6);
  margin: 8px 0;
  max-width: 90vw;
  word-wrap: break-word;
  white-space: pre-wrap;
  background: rgba(0, 0, 0, 0.5);
  padding: 8px;
  border-radius: 4px;
  border: 1px solid rgba(0, 255, 0, 0.4);
  min-height: 18px;
  color: #00ff00;
  font-weight: 500;
}

#preview, #live {
  margin-top: 8px;
  max-width: min(85vw, 600px);
  max-height: 45vh;
  border-radius: 6px;
  box-shadow: 0 0 20px rgba(0, 0, 0, 0.9);
  object-fit: contain;
  border: 1px solid rgba(0, 255, 0, 0.3);
}

#live {
  display: none;
  width: min(90vw, 650px);
  height: auto;
  max-height: 50vh;
  transform: rotate(180deg);
  transition: transform 0.3s ease;
}

#phoneCapture {
  display: none;
  margin-top: 8px;
  width: 100%;
}

.phonePhotos {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
  max-width: 95vw;
}

.phonePhotoFrame {
  flex: 1;
  min-width: min(42vw, 280px);
  max-width: min(48vw, 350px);
  text-align: center;
}

.phonePhoto {
  width: 100%;
  max-height: 50vh;
  object-fit: contain;
  border-radius: 6px;
  box-shadow: 0 0 15px rgba(0, 0, 0, 0.9);
  border: 1px solid rgba(0, 255, 0, 0.3);
  transition: transform 0.3s ease;
}

.phonePhotoLabel {
  margin: 6px 0 4px;
  font-family: "Courier New", monospace;
  font-size: 10px;
  color: #00ff00;
}

.phonePhotoControls {
  display: flex;
  justify-content: center;
  gap: 4px;
  flex-wrap: wrap;
}

/* --- ROTATE CONTROLS --- */
#rotateControls {
  position: absolute;
  top: 50%;
  right: max(10px, 1.5vw);
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  gap: 6px;
  z-index: 2000;
}

#rotateControls button {
  padding: 4px 6px;
  font-size: 10px;
}

/* --- RESPONSIVE DESIGN --- */
@media (max-width: 768px) {
  .topbar {
    padding: 6px 10px;
    gap: 5px;
  }

  .topbar h1 {
    font-size: 16px;
    margin-bottom: 4px;
  }

  .controls-row {
    gap: 3px;
  }

  button, a {
    padding: 4px 6px;
    font-size: 10px;
  }

  .main {
    padding: 8px 10px;
  }

  #output {
    font-size: 10px;
    padding: 6px;
    margin: 6px 0;
  }

  #preview, #live {
    max-width: min(90vw, 500px);
    max-height: 40vh;
  }

  .phonePhotoFrame {
    min-width: min(90vw, 250px);
    max-width: min(95vw, 320px);
  }

  .phonePhoto {
    max-height: 40vh;
  }

  #rotateControls {
    right: 8px;
  }

  #rotateControls button {
    padding: 3px 5px;
    font-size: 9px;
  }
}

@media (max-width: 480px) {
  .topbar {
    padding: 5px 8px;
    gap: 4px;
  }

  .topbar h1 {
    font-size: 14px;
  }

  .controls-row {
    gap: 2px;
  }

  button, a {
    padding: 4px 5px;
    font-size: 9px;
  }

  .main {
    padding: 6px 8px;
  }

  #output {
    font-size: 9px;
    padding: 5px;
    margin: 4px 0;
  }

  #preview, #live {
    max-width: 95vw;
    max-height: 35vh;
  }

  #rotateControls {
    right: 6px;
  }

  #rotateControls button {
    padding: 3px 4px;
    font-size: 8px;
  }
}
</style>
</head>
<body>

<div class="topbar">
  <h1>SKUNK WORKS NOC</h1>
  
  <div class="controls-row">
    <button onclick="runAction('netcheck.sh')">📡Network</button>
    <button onclick="location.href='network.html'">🗺OUI</button>
    <button onclick="location.href='sms.html')">📱SMS</button>
    <button onclick="runAction('capture.sh')">📷Cheese</button>
    <button onclick="startLive()">📹Live</button>
    <button onclick="runAction('sensor.sh')">⚡Volts</button>
    <button onclick="runAction('fmradiophone')">📻FMON</button>
    <button onclick="runAction('fmphoneoff')">📻OFF</button>
    <button onclick="runAction('read_light.py')">💡Lumen</button>
  </div>

  <div class="controls-row">
    <button onclick="location.href='websh.html'">💻Shell</button>
    <button onclick="location.href='btmic.html'">🎤Mic</button>
    <button onclick="runAction('relayon.sh')">🔌ON</button>
    <button onclick="runAction('relayoff.sh')">⚫OFF</button>
    <button onclick="runAction('phonelight1')">☀️ON</button>
    <button onclick="runAction('phonelight0')">🌑OFF</button>
    <button onclick="runAction('meteo.cgi')">⛅Weather</button>
    <button onclick="runAction('cleanup.sh')">🧹Clean</button>
    <button onclick="capturePhoneCameras()">📸Phone</button>
  </div>
</div>

<div class="main">
  <div id="output">READY</div>
  <img id="preview" src="" alt="Latest photo will appear here">

  <div style="position: relative; display: inline-block;">
    <img id="live" src="" alt="Live camera stream">
    <div id="rotateControls">
      <button onclick="rotateLeft()">⟲Left</button>
      <button onclick="rotateRight()">⟳Right</button>
    </div>
  </div>

  <section id="phoneCapture">
    <div class="phonePhotos">
      <div class="phonePhotoFrame">
        <img id="phoneRear" class="phonePhoto" alt="Rear phone camera photo">
        <div class="phonePhotoLabel">REAR</div>
        <div class="phonePhotoControls">
          <button onclick="rotatePhonePhoto('rear', -90)">⟲L</button>
          <button onclick="rotatePhonePhoto('rear', 90)">⟳R</button>
        </div>
      </div>
      <div class="phonePhotoFrame">
        <img id="phoneFront" class="phonePhoto" alt="Front phone camera photo">
        <div class="phonePhotoLabel">FRONT</div>
        <div class="phonePhotoControls">
          <button onclick="rotatePhonePhoto('front', -90)">⟲L</button>
          <button onclick="rotatePhonePhoto('front', 90)">⟳R</button>
        </div>
      </div>
    </div>
  </section>
</div>

<script>
let liveMode = false;
let rotation = 180;
let phoneRotations = { rear: 0, front: 0 };

async function loadLatestPhoto() {
  const preview = document.getElementById("preview");
  const fallback = "/1.jpeg";
  let source = fallback;

  try {
    const response = await fetch("/piscripts/latest.txt?t=" + Date.now(), { cache: "no-store" });
    const filename = (await response.text()).trim();
    if (response.ok && /^[A-Za-z0-9_.-]+\.(?:jpg|jpeg)$/i.test(filename)) {
      source = "/piscripts/" + filename;
    }
  } catch (error) {
    // The camera service image remains a valid fallback if the marker is unavailable.
  }

  preview.onload = () => {
    preview.style.display = "block";
  };
  preview.onerror = () => {
    if (source !== fallback) {
      source = fallback;
      preview.src = source + "?t=" + Date.now();
    } else {
      preview.style.display = "none";
    }
  };
  preview.src = source + "?t=" + Date.now();
}

/* -------------------------
   START LIVE STREAM
------------------------- */
function startLive() {
  fetch("/cgi-bin/stop_live.sh")
    .then(() => fetch("/cgi-bin/live.cgi"))
    .then(r => r.text())
    .then(t => {
      document.getElementById("output").innerText = t;
      const live = document.getElementById("live");
      const preview = document.getElementById("preview");
      const rotateControls = document.getElementById("rotateControls");
      document.getElementById("phoneCapture").style.display = "none";

      preview.style.display = "none";
      live.style.display = "block";
      rotateControls.style.display = "flex";
      live.src = "http://" + location.hostname + ":8000/";
    });
}

/* -------------------------
   UNIVERSAL ACTION HANDLER
------------------------- */
function runAction(script) {
  if (script === "capture.sh") {
    fetch("/cgi-bin/stop_live.sh").then(() => {
      liveMode = false;
      document.getElementById("live").style.display = "none";
      document.getElementById("live").src = "";
      document.getElementById("preview").style.display = "block";
      document.getElementById("rotateControls").style.display = "none";
      document.getElementById("phoneCapture").style.display = "none";

      fetch("/cgi-bin/" + script)
        .then(r => r.text())
        .then(t => {
          document.getElementById("output").innerText = t;
          const parts = t.split(":");
          if (parts.length === 2) {
            const file = parts[1].trim();
            document.getElementById("preview").src = file + "?t=" + Date.now();
          }
        });
    });
    return;
  }

  fetch("/cgi-bin/" + script)
    .then(r => r.text())
    .then(t => {
      const output = document.getElementById("output");
      const preview = document.getElementById("preview");
      const live = document.getElementById("live");
      const rotateControls = document.getElementById("rotateControls");

      if (script === "netcheck.sh" || script === "meteo.cgi") {
        preview.style.display = "none";
        live.style.display = "none";
        live.src = "";
        rotateControls.style.display = "none";
        document.getElementById("phoneCapture").style.display = "none";
        output.innerHTML = t;
        return;
      }

      output.innerText = t;
    });
}

function rotatePhonePhoto(camera, degrees) {
  phoneRotations[camera] += degrees;
  document.getElementById(camera === "rear" ? "phoneRear" : "phoneFront").style.transform = `rotate(${phoneRotations[camera]}deg)`;
}

function capturePhoneCameras() {
  const output = document.getElementById("output");
  const phoneCapture = document.getElementById("phoneCapture");
  output.innerText = "Freeing Pi camera and capturing phone cameras...";
  document.getElementById("preview").style.display = "none";
  document.getElementById("live").style.display = "none";
  document.getElementById("rotateControls").style.display = "none";
  phoneCapture.style.display = "block";
  fetch("/cgi-bin/stop_live.sh")
    .then(() => fetch("/cgi-bin/phone-cameras.cgi?t=" + Date.now(), { cache: "no-store" }))
    .then(response => response.text().then(text => ({ response, text })))
    .then(({ response, text }) => {
      if (!response.ok) throw new Error(text);
      const rear = text.match(/^rear=(.*)$/m);
      const front = text.match(/^front=(.*)$/m);
      if (!rear || !front) throw new Error(text || "No phone photos returned");
      document.getElementById("phoneRear").src = rear[1] + "?t=" + Date.now();
      document.getElementById("phoneFront").src = front[1] + "?t=" + Date.now();
      phoneRotations = { rear: 0, front: 0 };
      document.getElementById("phoneRear").style.transform = "rotate(0deg)";
      document.getElementById("phoneFront").style.transform = "rotate(0deg)";
      output.innerText = "Phone rear and front photos captured.";
    })
    .catch(error => { output.innerText = "Phone camera error: " + error.message; });
}

/* -------------------------
   ROTATION CONTROLS
------------------------- */
function rotateLeft() {
  rotation -= 90;
  document.getElementById("live").style.transform = `rotate(${rotation}deg)`;
}

function rotateRight() {
  rotation += 90;
  document.getElementById("live").style.transform = `rotate(${rotation}deg)`;
}

loadLatestPhoto();
</script>
</body>
</html>
