<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Skunk Works Pi Control</title>

<style>
body {
  background: url("skunk-bg.jpg") no-repeat center center fixed;
  background-size: cover;
  color: #eee;
  font-family: Arial, sans-serif;
  margin: 0;
  text-align: center;
}

/* --- TOP BAR --- */
.topbar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(4px);
  box-shadow: 0 0 10px black;
  padding: 8px 20px;
  z-index: 1000;
}

h1 {
  font-family: "Courier New", monospace;
  font-size: 30px;
  letter-spacing: 4px;
  text-shadow: 0 0 10px black;
  margin: 0;
  flex: 0 0 auto;
}

/* --- BUTTONS --- */
.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
}

button {
  padding: 5px 8px;
  font-size: 14px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  background: rgba(0,0,0,0.6);
  color: white;
  box-shadow: 0 0 8px black;
  transition: background 0.2s;
}

button:hover {
  background: rgba(255,255,255,0.2);
}

/* --- MAIN CONTENT --- */
.main {
  margin-top: 90px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

#output {
  margin-top: 10px;
  font-size: 16px;
  text-shadow: 0 0 5px black;
}

#preview, #live {
  margin-top: 15px;
  max-width: 90%;
  max-height: 70vh;
  border-radius: 8px;
  box-shadow: 0 0 20px rgba(0,0,0,0.8);
  object-fit: contain;
}

#live {
  display: none;
  width: 95%;
  height: auto;
  max-height: 75vh;
  transform: rotate(180deg);
  transition: transform 0.3s ease;
}

#phoneCapture {
  display: none;
  width: 95%;
  margin-top: 15px;
}

.phonePhotos {
  display: flex;
  justify-content: center;
  gap: 16px;
  flex-wrap: wrap;
}

.phonePhotoFrame {
  width: min(46%, 480px);
  min-width: 280px;
}

.phonePhoto {
  width: 100%;
  max-height: 65vh;
  object-fit: contain;
  border-radius: 8px;
  box-shadow: 0 0 20px rgba(0,0,0,0.8);
  transition: transform 0.3s ease;
}

.phonePhotoLabel {
  margin: 8px 0;
  font-family: "Courier New", monospace;
}

.phonePhotoControls {
  display: flex;
  justify-content: center;
  gap: 8px;
}

/* --- ROTATE CONTROLS --- */
#rotateControls {
  position: absolute;
  top: 50%;
  right: 20px;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  gap: 10px;
  z-index: 2000;
}
</style>
</head>
<body>

<div class="topbar">
  <div class="controls">
    <button onclick="runAction('netcheck.sh')">🌐Network</button>
    <button onclick="location.href='network.html'">◎OUI Map</button>
    <button onclick="location.href='sms.html'">💬SMS</button>
    <button onclick="runAction('capture.sh')">📸Cheese</button>
    <button onclick="startLive()">🎥Live</button>
    <button onclick="runAction('sensor.sh')">📟Volts</button>
    <button onclick="runAction('fmradiophone')">📻FM ON</button>
    <button onclick="runAction('fmphoneoff')">❌FM OFF</button>
    <button onclick="runAction('read_light.py')">💡Lumen</button>
    <button onclick="location.href='websh.html'">⌘WebShell</button>
    <button onclick="capturePhoneCameras()">📱Camera</button>
  </div>

  <h1>SKUNK WORKS CONTROL</h1>

  <div class="controls">
    <button onclick="runAction('relayon.sh')">⚡LED ON</button>
    <button onclick="runAction('relayoff.sh')">❌LED OFF</button>
    <button onclick="runAction('phonelight1')">🔦ON</button>
    <button onclick="runAction('phonelight0')">❌OFF</button>
    <button onclick="runAction('meteo.cgi')">🌦Weather</button>
    <button onclick="runAction('cleanup.sh')">🧹Clean</button>
  </div>
</div>

<div class="main">
  <div id="output"></div>
  <img id="preview" src="" alt="Latest photo will appear here">

  <div style="position: relative; display: inline-block;">
    <img id="live" src="" alt="Live camera stream">
    <div id="rotateControls">
      <button onclick="rotateLeft()">⟲Left</button>
      <button onclick="rotateRight()">⟳Right</button>
    </div>
  </div>

  <section id="phoneCapture">
    <div class="phonePhotos">
      <div class="phonePhotoFrame">
        <img id="phoneRear" class="phonePhoto" alt="Rear phone camera photo">
        <div class="phonePhotoLabel">REAR CAMERA</div>
        <div class="phonePhotoControls">
          <button onclick="rotatePhonePhoto('rear', -90)">⟲Left</button>
          <button onclick="rotatePhonePhoto('rear', 90)">⟳Right</button>
        </div>
      </div>
      <div class="phonePhotoFrame">
        <img id="phoneFront" class="phonePhoto" alt="Front phone camera photo">
        <div class="phonePhotoLabel">FRONT CAMERA</div>
        <div class="phonePhotoControls">
          <button onclick="rotatePhonePhoto('front', -90)">⟲Left</button>
          <button onclick="rotatePhonePhoto('front', 90)">⟳Right</button>
        </div>
      </div>
    </div>
  </section>
</div>

<script>
let liveMode = false;
let rotation = 180;
let phoneRotations = { rear: 0, front: 0 };

/* -------------------------
   START LIVE STREAM
------------------------- */
function startLive() {
  fetch("/cgi-bin/stop_live.sh")
    .then(() => fetch("/cgi-bin/live.cgi"))
    .then(r => r.text())
    .then(t => {
      document.getElementById("output").innerText = t;
      const live = document.getElementById("live");
      const preview = document.getElementById("preview");
      const rotateControls = document.getElementById("rotateControls");
      document.getElementById("phoneCapture").style.display = "none";

      preview.style.display = "none";
      live.style.display = "block";
      rotateControls.style.display = "flex";
      live.src = "http://" + location.hostname + ":8000/";
    });
}

/* -------------------------
   UNIVERSAL ACTION HANDLER
------------------------- */
function runAction(script) {
  if (script === "capture.sh") {
    fetch("/cgi-bin/stop_live.sh").then(() => {
      liveMode = false;
      document.getElementById("live").style.display = "none";
      document.getElementById("live").src = "";
      document.getElementById("preview").style.display = "block";
      document.getElementById("rotateControls").style.display = "none";
      document.getElementById("phoneCapture").style.display = "none";

      fetch("/cgi-bin/" + script)
        .then(r => r.text())
        .then(t => {
          document.getElementById("output").innerText = t;
          const parts = t.split(":");
          if (parts.length === 2) {
            const file = parts[1].trim();
            document.getElementById("preview").src = file + "?t=" + Date.now();
          }
        });
    });
    return;
  }

  fetch("/cgi-bin/" + script)
    .then(r => r.text())
    .then(t => {
      const output = document.getElementById("output");
      const preview = document.getElementById("preview");
      const live = document.getElementById("live");
      const rotateControls = document.getElementById("rotateControls");

      if (script === "netcheck.sh" || script === "meteo.cgi") {
        preview.style.display = "none";
        live.style.display = "none";
        live.src = "";
        rotateControls.style.display = "none";
        document.getElementById("phoneCapture").style.display = "none";
        output.innerHTML = t;
        return;
      }

      output.innerText = t;
    });
}

function rotatePhonePhoto(camera, degrees) {
  phoneRotations[camera] += degrees;
  document.getElementById(camera === "rear" ? "phoneRear" : "phoneFront").style.transform = `rotate(${phoneRotations[camera]}deg)`;
}

function capturePhoneCameras() {
  const output = document.getElementById("output");
  const phoneCapture = document.getElementById("phoneCapture");
  output.innerText = "Freeing Pi camera and capturing phone cameras...";
  document.getElementById("preview").style.display = "none";
  document.getElementById("live").style.display = "none";
  document.getElementById("rotateControls").style.display = "none";
  phoneCapture.style.display = "block";
  fetch("/cgi-bin/stop_live.sh")
    .then(() => fetch("/cgi-bin/phone-cameras.cgi?t=" + Date.now(), { cache: "no-store" }))
    .then(response => response.text().then(text => ({ response, text })))
    .then(({ response, text }) => {
      if (!response.ok) throw new Error(text);
      const rear = text.match(/^rear=(.*)$/m);
      const front = text.match(/^front=(.*)$/m);
      if (!rear || !front) throw new Error(text || "No phone photos returned");
      document.getElementById("phoneRear").src = rear[1] + "?t=" + Date.now();
      document.getElementById("phoneFront").src = front[1] + "?t=" + Date.now();
      phoneRotations = { rear: 0, front: 0 };
      document.getElementById("phoneRear").style.transform = "rotate(0deg)";
      document.getElementById("phoneFront").style.transform = "rotate(0deg)";
      output.innerText = "Phone rear and front photos captured.";
    })
    .catch(error => { output.innerText = "Phone camera error: " + error.message; });
}

/* -------------------------
   ROTATION CONTROLS
------------------------- */
function rotateLeft() {
  rotation -= 90;
  document.getElementById("live").style.transform = `rotate(${rotation}deg)`;
}

function rotateRight() {
  rotation += 90;
  document.getElementById("live").style.transform = `rotate(${rotation}deg)`;
}
</script>
</body>
</html>
