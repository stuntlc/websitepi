<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skunk Works Pi Control</title>

<style>
:root {
  --ink: #d8f3dc;
  --muted: #8bb99b;
  --green: #52d273;
  --line: #24583a;
  --panel: rgba(4, 18, 12, .9);
  --red: #ee6b72;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  background: #07130d url("skunk-bg.jpg") center / cover fixed;
  font-family: "Courier New", monospace;
}
body::before { content: ""; position: fixed; inset: 0; background: rgba(1, 10, 6, .78); pointer-events: none; }
main { position: relative; max-width: 1400px; margin: 0 auto; padding: 28px 20px 44px; }
header { display: flex; align-items: end; justify-content: space-between; gap: 20px; border-bottom: 1px solid var(--line); padding-bottom: 18px; }
h1 { margin: 0; color: var(--green); font-size: clamp(22px, 4vw, 36px); letter-spacing: 3px; }
.subtitle { color: var(--muted); margin: 8px 0 0; font-size: 13px; }
.actions, .controls, .phonePhotoControls { display: flex; flex-wrap: wrap; gap: 8px; }
button, a { border: 1px solid var(--line); background: #0b2517; color: var(--ink); padding: 9px 13px; font: inherit; text-decoration: none; cursor: pointer; }
button:hover, a:hover { border-color: var(--green); color: white; }
.statusbar { display: flex; justify-content: space-between; gap: 16px; color: var(--muted); padding: 14px 0; font-size: 13px; }
.panel { background: var(--panel); border: 1px solid var(--line); padding: 16px; box-shadow: 0 0 22px rgba(0,0,0,.45); }
.panel-title { display: flex; justify-content: space-between; align-items: center; margin: 0 0 14px; color: var(--green); font-size: 14px; letter-spacing: 1px; }
.main { display: grid; gap: 18px; }
#output { min-height: 24px; margin: 0; padding: 10px; border: 1px solid var(--line); background: rgba(1, 12, 7, .55); color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
.media-panel { min-width: 0; text-align: center; }

#preview, #live {
  margin-top: 15px;
  max-width: 90%;
  max-height: 70vh;
  border-radius: 8px;
  box-shadow: 0 0 20px rgba(0,0,0,.45);
  object-fit: contain;
}

#live {
  display: none;
  width: 95%;
  height: auto;
  max-height: 75vh;
  transform: rotate(180deg);
  transition: transform 0.3s ease;
}

#phoneCapture {
  display: none;
  width: 95%;
  margin-top: 15px;
}

.phonePhotos {
  display: flex;
  justify-content: center;
  gap: 16px;
  flex-wrap: wrap;
}

.phonePhotoFrame {
  width: min(46%, 480px);
  min-width: 280px;
}

.phonePhoto {
  width: 100%;
  max-height: 65vh;
  object-fit: contain;
  border-radius: 8px;
  box-shadow: 0 0 20px rgba(0,0,0,0.8);
  transition: transform 0.3s ease;
}

.phonePhotoLabel {
  margin: 8px 0;
  font-family: "Courier New", monospace;
}

.phonePhotoControls {
  display: flex;
  justify-content: center;
  gap: 8px;
}

/* --- ROTATE CONTROLS --- */
#rotateControls {
  position: absolute;
  top: 50%;
  right: 20px;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  gap: 10px;
  z-index: 2000;
}
@media (max-width: 760px) {
  main { padding: 18px 12px 30px; }
  header, .statusbar { align-items: flex-start; flex-direction: column; }
  .actions { width: 100%; }
  .top-actions { width: 100%; }
}
</style>
</head>
<body>

<main>
  <header>
    <div>
      <h1>SKUNK WORKS CONTROL</h1>
      <p class="subtitle">PI OPERATIONS // CAMERA, RADIO, LIGHTS, NETWORK</p>
    </div>
    <div class="actions top-actions">
      <a href="websh.html">[ WEBSHELL ]</a>
      <a href="network.html">[ OUI MAP ]</a>
      <a href="sms.html">[ SMS ]</a>
      <a href="btmic.html">[ BT MIC ]</a>
    </div>
  </header>
  <div class="statusbar"><span>LOCAL CONTROL SURFACE</span><span id="mode-status">READY</span></div>
  <section class="panel">
    <h2 class="panel-title"><span>PI COMMANDS</span><span>ONLINE</span></h2>
    <div class="controls">
      <button onclick="runAction('netcheck.sh')">NETWORK</button>
      <button onclick="runAction('capture.sh')">CAPTURE</button>
      <button onclick="startLive()">LIVE</button>
      <button onclick="runAction('sensor.sh')">VOLTS</button>
      <button onclick="runAction('fmradiophone')">FM ON</button>
      <button onclick="runAction('fmphoneoff')">FM OFF</button>
      <button onclick="runAction('read_light.py')">LUMEN</button>
      <button onclick="runAction('relayon.sh')">LED ON</button>
      <button onclick="runAction('relayoff.sh')">LED OFF</button>
      <button onclick="runAction('phonelight1')">PHONE LIGHT ON</button>
      <button onclick="runAction('phonelight0')">PHONE LIGHT OFF</button>
      <button onclick="runAction('meteo.cgi')">WEATHER</button>
      <button onclick="runAction('cleanup.sh')">CLEAN</button>
      <button onclick="capturePhoneCameras()">PHONE CAMERAS</button>
    </div>
  </section>
  <section class="panel media-panel">
    <div id="output">READY.</div>
    <img id="preview" src="" alt="Latest photo will appear here">

  <div style="position: relative; display: inline-block;">
    <img id="live" src="" alt="Live camera stream">
    <div id="rotateControls">
      <button onclick="rotateLeft()">⟲Left</button>
      <button onclick="rotateRight()">⟳Right</button>
    </div>
  </div>

  <section id="phoneCapture">
    <div class="phonePhotos">
      <div class="phonePhotoFrame">
        <img id="phoneRear" class="phonePhoto" alt="Rear phone camera photo">
        <div class="phonePhotoLabel">REAR CAMERA</div>
        <div class="phonePhotoControls">
          <button onclick="rotatePhonePhoto('rear', -90)">⟲Left</button>
          <button onclick="rotatePhonePhoto('rear', 90)">⟳Right</button>
        </div>
      </div>
      <div class="phonePhotoFrame">
        <img id="phoneFront" class="phonePhoto" alt="Front phone camera photo">
        <div class="phonePhotoLabel">FRONT CAMERA</div>
        <div class="phonePhotoControls">
          <button onclick="rotatePhonePhoto('front', -90)">⟲Left</button>
          <button onclick="rotatePhonePhoto('front', 90)">⟳Right</button>
        </div>
      </div>
    </div>
  </section>
</section>
</main>

<script>
let liveMode = false;
let rotation = 180;
let phoneRotations = { rear: 0, front: 0 };

async function loadLatestPhoto() {
  const preview = document.getElementById("preview");
  const fallback = "/1.jpeg";
  let source = fallback;

  try {
    const response = await fetch("/piscripts/latest.txt?t=" + Date.now(), { cache: "no-store" });
    const filename = (await response.text()).trim();
    if (response.ok && /^[A-Za-z0-9_.-]+\.(?:jpg|jpeg)$/i.test(filename)) {
      source = "/piscripts/" + filename;
    }
  } catch (error) {
    // The camera service image remains a valid fallback if the marker is unavailable.
  }

  preview.onload = () => {
    preview.style.display = "block";
  };
  preview.onerror = () => {
    if (source !== fallback) {
      source = fallback;
      preview.src = source + "?t=" + Date.now();
    } else {
      preview.style.display = "none";
    }
  };
  preview.src = source + "?t=" + Date.now();
}

/* -------------------------
   START LIVE STREAM
------------------------- */
function startLive() {
  fetch("/cgi-bin/stop_live.sh")
    .then(() => fetch("/cgi-bin/live.cgi"))
    .then(r => r.text())
    .then(t => {
      document.getElementById("output").innerText = t;
      const live = document.getElementById("live");
      const preview = document.getElementById("preview");
      const rotateControls = document.getElementById("rotateControls");
      document.getElementById("phoneCapture").style.display = "none";

      preview.style.display = "none";
      live.style.display = "block";
      rotateControls.style.display = "flex";
      live.src = "http://" + location.hostname + ":8000/";
    });
}

/* -------------------------
   UNIVERSAL ACTION HANDLER
------------------------- */
function runAction(script) {
  if (script === "capture.sh") {
    fetch("/cgi-bin/stop_live.sh").then(() => {
      liveMode = false;
      document.getElementById("live").style.display = "none";
      document.getElementById("live").src = "";
      document.getElementById("preview").style.display = "block";
      document.getElementById("rotateControls").style.display = "none";
      document.getElementById("phoneCapture").style.display = "none";

      fetch("/cgi-bin/" + script)
        .then(r => r.text())
        .then(t => {
          document.getElementById("output").innerText = t;
          const parts = t.split(":");
          if (parts.length === 2) {
            const file = parts[1].trim();
            document.getElementById("preview").src = file + "?t=" + Date.now();
          }
        });
    });
    return;
  }

  fetch("/cgi-bin/" + script)
    .then(r => r.text())
    .then(t => {
      const output = document.getElementById("output");
      const preview = document.getElementById("preview");
      const live = document.getElementById("live");
      const rotateControls = document.getElementById("rotateControls");

      if (script === "netcheck.sh" || script === "meteo.cgi") {
        preview.style.display = "none";
        live.style.display = "none";
        live.src = "";
        rotateControls.style.display = "none";
        document.getElementById("phoneCapture").style.display = "none";
        output.innerHTML = t;
        return;
      }

      output.innerText = t;
    });
}

function rotatePhonePhoto(camera, degrees) {
  phoneRotations[camera] += degrees;
  document.getElementById(camera === "rear" ? "phoneRear" : "phoneFront").style.transform = `rotate(${phoneRotations[camera]}deg)`;
}

function capturePhoneCameras() {
  const output = document.getElementById("output");
  const phoneCapture = document.getElementById("phoneCapture");
  output.innerText = "Freeing Pi camera and capturing phone cameras...";
  document.getElementById("preview").style.display = "none";
  document.getElementById("live").style.display = "none";
  document.getElementById("rotateControls").style.display = "none";
  phoneCapture.style.display = "block";
  fetch("/cgi-bin/stop_live.sh")
    .then(() => fetch("/cgi-bin/phone-cameras.cgi?t=" + Date.now(), { cache: "no-store" }))
    .then(response => response.text().then(text => ({ response, text })))
    .then(({ response, text }) => {
      if (!response.ok) throw new Error(text);
      const rear = text.match(/^rear=(.*)$/m);
      const front = text.match(/^front=(.*)$/m);
      if (!rear || !front) throw new Error(text || "No phone photos returned");
      document.getElementById("phoneRear").src = rear[1] + "?t=" + Date.now();
      document.getElementById("phoneFront").src = front[1] + "?t=" + Date.now();
      phoneRotations = { rear: 0, front: 0 };
      document.getElementById("phoneRear").style.transform = "rotate(0deg)";
      document.getElementById("phoneFront").style.transform = "rotate(0deg)";
      output.innerText = "Phone rear and front photos captured.";
    })
    .catch(error => { output.innerText = "Phone camera error: " + error.message; });
}

/* -------------------------
   ROTATION CONTROLS
------------------------- */
function rotateLeft() {
  rotation -= 90;
  document.getElementById("live").style.transform = `rotate(${rotation}deg)`;
}

function rotateRight() {
  rotation += 90;
  document.getElementById("live").style.transform = `rotate(${rotation}deg)`;
}

loadLatestPhoto();
</script>
</body>
</html>
